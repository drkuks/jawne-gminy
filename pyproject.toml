[project]
name = "jawne-gminy"
version = "0.1.0"
description = "Jawne Gminy: public financial data on Polish municipalities and municipal companies"
requires-python = ">=3.12"
license = "EUPL-1.2"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "openpyxl>=3.1.5",
    "py7zr>=1.1.4",
    "duckdb>=1.1",
    "jinja2>=3.1.6",
    "shapely>=2.2.0",
    "pyproj>=3.8.0",
    "lxml>=6.1.3",
]

[project.scripts]
jg = "jg.cli:app"

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest>=8",
    "pytest-playwright>=0.10.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: testy z prawdziwą siecią (pomijane domyślnie, uruchamiane z -m network)",
    "browser: testy Playwright z prawdziwym Chromium",
]
addopts = "-m 'not network'"
