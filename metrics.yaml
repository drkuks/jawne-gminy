    document: e-sprawozdanie finansowe (XML), rachunek przepływów pieniężnych
    locator: RachPrzeplywow/PrzeplywyPosr|PrzeplywyBezp/B/B_II/B_II_1 (KwotaA)
  control_values:
  - {entity: '0000136724', year: 2025, value: 1891014.21, origin: 'tests/fixtures/rdf/zwik-2025-esprawozdanie.xml'}
