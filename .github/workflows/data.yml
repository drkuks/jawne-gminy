# Data pipeline run and site build (without company finances: manual RDF files are not in CI).
# Schedule: weekly on Monday; MF publishes reports quarterly and the annual ones ("after Q4")
# usually in March–April, so a weekly run picks up new files with a delay of at most 7 days.
# Source file archive and rate-limit state between runs: actions/cache (the SHA-256 archive is
# not committed to the repository).
# Publication to GitHub Pages only when the repository variable PUBLIKACJA = "tak" (no public
# deployment until the owner decides).
name: data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      od:
        description: "First year of the series"
        default: "2019"
      do:
        description: "Last year of the series, or auto"
        default: "auto"

concurrency:
  group: dane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  przebieg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GUS_BDL_KEY: ${{ secrets.GUS_BDL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: |
            archive
            var
          key: zrodla-${{ github.run_id }}
          restore-keys: zrodla-
      - run: uv sync --locked
      - name: Pipeline run
        # Parameters via environment variables (no text interpolation into the script).
        env:
          OD: ${{ inputs.od || '2019' }}
          DO: ${{ inputs.do || 'auto' }}
          # Site served at https://drkuks.github.io/jawne-gminy/.
          JG_BAZA: /${{ github.event.repository.name }}/
        run: uv run jg przebieg --od "$OD" --do "$DO" --bez-finansow-spolek
      - name: Unit tests on current code
        run: uv run pytest -q -m "not browser"
      # Archive, ETag cache and rate-limit state are saved even after a failed run.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            archive
            var
          key: zrodla-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-przebiegu
          if-no-files-found: warn
          path: |
            data/raport_przebiegu.md
            data/gminy.raport.txt
            var/logs/requests.jsonl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publikacja:
    needs: przebieg
    if: ${{ vars.PUBLIKACJA == 'tak' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
